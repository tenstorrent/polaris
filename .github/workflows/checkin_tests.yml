name: Checkin Tests

on:
  workflow_dispatch:
  push:
  pull_request:
  merge_group:

jobs:
  checkin-tests:
    env:
      GIST_ID: 'c230835a5065366c13d3bbfb79f23bf6'
      GIST_TOKEN: ${{ secrets.POLARIS_GIST_TOKEN }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_SHA: ${{ github.sha }}
      PASS_YELLOW: 75
      PASS_REQUIRED: 95
      COVERAGE_YELLOW: 75
      COVERAGE_REQUIRED: 85
      # Boolean gate for the lfcdownload step. Materialised at job level so every
      # gated step reads a stable env value (using `secrets.*` directly in
      # step-level `if:` raised "Unrecognized named-value" in our testing). On
      # fork PRs the secret is empty per GitHub policy, so this resolves to
      # 'false'. Issue #461.
      HAS_LFC_SECRET: ${{ secrets.LFC_SERVER_URLS != '' }}
      # True only on `pull_request` runs from a fork (head.repo != base.repo).
      # On any other event (push, merge_group, internal PR) the secret is
      # expected to be present, so an absent secret indicates admin
      # misconfiguration rather than fork policy. Issue #461.
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    runs-on: tt-ubuntu-2204-large-stable
    strategy:
      max-parallel: 5

    defaults:
      run:
        shell: bash -el {0}

    steps:
    - id: checkout
      name: Checkout
      uses: actions/checkout@v4

    - id: lfcdownload
      name: Download required files from LFC
      # Skip on fork PRs where the secret is unavailable (GitHub policy: fork PRs
      # cannot read secrets). LFC-dependent tests carry the `tools_secondary`
      # marker, which the default checkin marker filter excludes — so coverage
      # on fork PRs is unaffected. See issue #461. Gate reads `env.HAS_LFC_SECRET`
      # (set at job level above — see that block for the rationale).
      if: ${{ env.HAS_LFC_SECRET == 'true' }}
      uses: ./.github/actions/lfcdownload
      with:
        files: 'ext_test_onnx_models.tar.gz ext_llk_elf_files.tar.gz'
        lfc-server-urls: ${{ secrets.LFC_SERVER_URLS }}

    - id: lfcdownload-skip-notice-fork-pr
      name: LFC download skipped (fork PR — secrets unavailable by policy)
      if: ${{ env.HAS_LFC_SECRET == 'false' && env.IS_FORK_PR == 'true' }}
      run: |
        echo "::warning title=LFC download skipped::Fork-PR run — secrets unavailable by GitHub policy. LFC artifacts will NOT be downloaded for this run."
        echo "LFC-dependent tests carry the tools_secondary marker, which is excluded from default checkin runs — so checkin coverage on fork PRs is unaffected."
        echo "Full CI including LFC-dependent tests runs at merge-queue time via the merge_group trigger, before any PR actually lands in main."

    - id: lfcdownload-missing-secret-error
      name: LFC_SERVER_URLS missing on non-fork run (admin misconfiguration)
      if: ${{ env.HAS_LFC_SECRET == 'false' && env.IS_FORK_PR == 'false' }}
      run: |
        echo "::error title=LFC_SERVER_URLS not set::Expected on this event (${{ github.event_name }}) but the secret is empty. Check repo settings — internal CI should not silently skip the LFC download."
        exit 1

    - id: setup-mamba
      name: Setup mamba - developer
      if: '!cancelled()'
      uses: ./.github/actions/setup_mamba
      with:
        environment-file: envdev.yaml
        environment-name: poldevenv

    - id: run-unit-and-coverage-tests
      name: Run Unit and Coverage Tests
      if: '!cancelled()'
      uses: ./.github/actions/run-python-tests

    - id: run-static-analysis
      name: Run Static Analysis
      if: '!cancelled()'
      uses: ./.github/actions/run-static-analysis

    - id: generate-test-badges
      name: Generate Test and Coverage Badges
      if: ${{ !cancelled() && github.event_name == 'push' }}
      uses: ./.github/actions/generate-test-badges
      with:
        gist-id: ${{ env.GIST_ID }}
        gist-token: ${{ env.GIST_TOKEN }}
        repo-name: ${{ env.REPO_NAME }}
        is-main-branch: ${{ github.ref == 'refs/heads/main' }}
        coverage-yellow-threshold: ${{ env.COVERAGE_YELLOW }}
        coverage-required-threshold: ${{ env.COVERAGE_REQUIRED }}
        test-yellow-threshold: ${{ env.PASS_YELLOW }}
        test-required-threshold: ${{ env.PASS_REQUIRED }}

    - id: generate-status-badges
      name: Generate Status Badges
      if: ${{ !cancelled() && github.event_name == 'push' }}
      uses: ./.github/actions/generate-status-badges
      with:
        gist-id: ${{ env.GIST_ID }}
        gist-token: ${{ env.GIST_TOKEN }}
        repo-name: ${{ env.REPO_NAME }}
        is-main-branch: ${{ github.ref == 'refs/heads/main' }}
        static-tests-outcome: ${{ steps.run-static-analysis.outputs.static-tests-outcome }}
        spdx-tests-outcome: ${{ steps.run-static-analysis.outputs.license-checks-outcome }}

    - id: upload-artifacts
      name: Upload artifacts
      if: '!cancelled()'
      uses: actions/upload-artifact@v4
      with:
        name: checkin_artifacts
        path: |
           .coverage
           __ci/json
           __ci/html
           __RUN_TESTS
           !__RUN_TESTS/**/*.onnx

    - id: check-overall-success
      name: Check Overall Success
      if: '!cancelled()'
      run: |
        echo "Checking overall job success status..."
        echo "This step will succeed ONLY if ALL prior steps have succeeded, regardless of continue-on-error settings"
        echo ""

        # Track steps that are not successful
        NON_SUCCESS_STEPS=""

        # Check all test and processing steps - must be 'success' to pass
        if [[ "${{ steps.run-unit-and-coverage-tests.outcome }}" != "success" ]]; then
          echo "❌ Unit and coverage tests: ${{ steps.run-unit-and-coverage-tests.outcome }}"
          NON_SUCCESS_STEPS="$NON_SUCCESS_STEPS run-unit-and-coverage-tests(${{ steps.run-unit-and-coverage-tests.outcome }})"
        else
          echo "✅ Unit and coverage tests: success"
        fi

        if [[ "${{ steps.run-static-analysis.outcome }}" != "success" ]]; then
          echo "❌ Static analysis: ${{ steps.run-static-analysis.outcome }}"
          NON_SUCCESS_STEPS="$NON_SUCCESS_STEPS run-static-analysis(${{ steps.run-static-analysis.outcome }})"
        else
          echo "✅ Static analysis: success"
        fi

        if [[ "${{ steps.generate-test-badges.outcome }}" != "success" && "${{ steps.generate-test-badges.outcome }}" != "skipped" ]]; then
          echo "❌ Test badges generation: ${{ steps.generate-test-badges.outcome }}"
          NON_SUCCESS_STEPS="$NON_SUCCESS_STEPS generate-test-badges(${{ steps.generate-test-badges.outcome }})"
        else
          echo "✅ Test badges generation: ${{ steps.generate-test-badges.outcome }}"
        fi

        if [[ "${{ steps.generate-status-badges.outcome }}" != "success" && "${{ steps.generate-status-badges.outcome }}" != "skipped" ]]; then
          echo "❌ Status badges generation: ${{ steps.generate-status-badges.outcome }}"
          NON_SUCCESS_STEPS="$NON_SUCCESS_STEPS generate-status-badges(${{ steps.generate-status-badges.outcome }})"
        else
          echo "✅ Status badges generation: ${{ steps.generate-status-badges.outcome }}"
        fi

        if [[ "${{ steps.upload-artifacts.outcome }}" != "success" ]]; then
          echo "❌ Artifacts upload: ${{ steps.upload-artifacts.outcome }}"
          NON_SUCCESS_STEPS="$NON_SUCCESS_STEPS upload-artifacts(${{ steps.upload-artifacts.outcome }})"
        else
          echo "✅ Artifacts upload: success"
        fi

        # Succeed only if ALL steps succeeded
        if [[ -n "$NON_SUCCESS_STEPS" ]]; then
          echo ""
          echo "❌ Job failed - not all steps succeeded:$NON_SUCCESS_STEPS"
          echo "Overall job status: FAILED"
          exit 1
        else
          echo ""
          echo "🎉 ALL steps completed successfully!"
          echo "Overall job status: PASSED"
        fi

  userenv-tests:
    runs-on: tt-ubuntu-2204-large-stable
    strategy:
      max-parallel: 5

    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup mamba - user
      uses: ./.github/actions/setup_mamba
      with:
        environment-file: environment.yaml
        environment-name: poluserenv

    - name: userenv-checkin-tests
      if: '!cancelled()'
      run: |
        python checkin_tests.py workloads

    - name: Upload artifacts
      if: '!cancelled()'
      uses: actions/upload-artifact@v4
      with:
        name: checkin_userenv_artifacts
        path: |
           __RUN_TESTS
           !__RUN_TESTS/**/*.onnx

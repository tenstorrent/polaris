#
# Blackhole™ architecture spec (parallel to config/tt_wh.yaml).
# Product details: https://docs.tenstorrent.com/aibs/blackhole/specifications.html
#
# Part numbers: p100a TC-03008, p150a TC-03003, p150b TC-03002
# | Card  | Tensix | AI clock (max) | GDDR6 | Speed   | BW      |
# | p100a | 120    | 1.35 GHz       | 28 GB | 16 GT/s | 448 GB/s|
# | p150a | 120    | 1.35 GHz       | 32 GB | 16 GT/s | 512 GB/s|
# | p150b | 120    | 1.35 GHz       | 32 GB | 16 GT/s | 512 GB/s|
#
# tensix instruction TPT tables below are copied from tt_wh.yaml as a placeholder
# until Blackhole-calibrated throughput data exists in-repo.
ipblocks:
    -   name: tensix
        iptype: compute
        l2_cache:
            num_banks: 32
            bytes_per_clk_per_bank: 64
        pipes:
        -   name: matrix
            num_units   : 1
            freq_MHz    : 1000
            instructions:
            -   {name: add, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: sub, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: mul, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
            -   {name: mac, tpt: { int8: 2048, bf16: 512, fp16: 512, fp8: 2048,}}
        -   name: vector
            num_units   : 1
            freq_MHz    : 1000
            instructions:
            -   {name: add,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sub,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mul,   tpt: { int32: 32., fp32: 32. }}
            -   {name: div,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mac,   tpt: { int32: 32., fp32: 32. }}
            -   {name: tanh,  tpt: { int32: 32., fp32: 32. }}
            -   {name: log,   tpt: { int32: 32., fp32: 32. }}
            -   {name: exp,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sqrt, tpt: { int32: 32., fp32: 32. }}
            -   {name: rsqrt, tpt: { int32: 32., fp32: 32. }}
            -   {name: reciprocal, tpt: { int32: 32., fp32: 32. }}
            -   {name: cmp,   tpt: { int32: 32., fp32: 32. }}
            -   {name: mov,   tpt: { int32: 32., fp32: 32. }}
            -   {name: max,   tpt: { int32: 32., fp32: 32. }}
            -   {name: sin, tpt: { int32: 32., fp32: 32. }}
            -   {name: cos, tpt: { int32: 32., fp32: 32. }}

    -   name: gddr6_bh
        iptype: memory
        technology: GDDR
        data_bits : 32
        data_rate : 8
        freq_MHz  : 1000
        size_GB   : 4
        transfer_rate_GTs : 16.0

packages:
    -   name: Blackhole
        instances:
        -   name: p100a
            operator_lookup_file: lfc://hlm-lut/bh_p100a_lut_v5.yaml
            # Logical tensix grid (x, y) — see doc/TTNN_SHIM_ARCHITECTURE.md §17.
            # Source: tt-metal/tt_metal/core_descriptors/blackhole_140_arch.yaml (end=[12, 9] inclusive → 13×10).
            # p100a has one column reserved → effective 12×10 = 120 cores (matches num_units below).
            #
            # UNRESOLVED, and currently harmless: the refrun disagrees with this
            # value.  Every row of
            # __refrun_cache/resnet50/bh/p100a/merged_ops_resnet50-02b76a9-blackhole-p100a-260816.csv
            # reports AVAILABLE WORKER CORE COUNT = 110, and no op dispatches
            # on more than 110 (110 = 11x10).  This says 12x10 = 120.
            #
            # Left as-is deliberately.  Measured at both values across resnet50,
            # vgg_unet, vit (and llama3 on BH): identical op counts, identical
            # per-optype census, identical LUT hits.  Three things mask it:
            #   1. _HALO_EXT_Y_OVERRIDES_BY_DEVICE is TRANSCRIBED from the
            #      capture, so the largest grid consumer never reads this;
            #   2. everywhere else the grid only feeds values that are compared
            #      against each other, so a uniformly-wrong grid cancels;
            #   3. find_closest_largest_divisor_with_num_padding walks down to
            #      the same divisor from either start.
            #
            # Mask (1) LIFTS if anyone ports the halo derivation
            # (sliding_window.cpp: generate_shard_boundaries ->
            # generate_max_out_nsticks_per_core), which reads
            # config.num_cores_nhw directly.  VERIFY THIS GRID AGAINST THE
            # CAPTURE BEFORE DOING THAT, or the derived table will be wrong in a
            # way the transcribed one currently hides.
            #
            # num_units below is a separate question: it feeds the analytical
            # cost model only, and total LUT msecs is identical at 110/120/130,
            # so it does not affect LUT-backed runs.
            compute_grid_size: [12, 10]
            ipgroups:
            -   ipname: tensix
                iptype: compute
                num_units   : 120
                ramp_penalty: 100
                ip_overrides:
                    pipes.matrix.freq_MHz: 1350
                    pipes.vector.freq_MHz: 1350
            -   ipname: gddr6_bh
                iptype: memory
                num_units: 7
        -   name: p150a
            ipgroups:
            -   ipname: tensix
                iptype: compute
                num_units   : 120
                ramp_penalty: 100
                ip_overrides:
                    pipes.matrix.freq_MHz: 1350
                    pipes.vector.freq_MHz: 1350
            -   ipname: gddr6_bh
                iptype: memory
                num_units: 8
        -   name: p150b
            ipgroups:
            -   ipname: tensix
                iptype: compute
                num_units   : 120
                ramp_penalty: 100
                ip_overrides:
                    pipes.matrix.freq_MHz: 1350
                    pipes.vector.freq_MHz: 1350
            -   ipname: gddr6_bh
                iptype: memory
                num_units: 8

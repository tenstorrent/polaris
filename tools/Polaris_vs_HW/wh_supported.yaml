workloads:
  - api: TTSIM
    name: RESNET50
    basedir: workloads
    module: ResNet@basicresnet.py
    params:
      bs: 1
      init_stride: 4
      layers: [3, 4, 6, 3]
      num_channels: 3
      num_classes: 1000
      use_adaptive_pool: true
    instances:
      rn50_b1_hd:
        img_height: 224
        img_width: 224
      rn50_b1_uhd:
        img_height: 224
        img_width: 224
  - api: TTSIM
    name: UNet
    basedir: workloads/UNet
    module: UNet@unet_model.py
    params:
      bs: 1
    instances:
      unet_b1:
        n_channels: 3
        n_classes: 2
        img_size: 256
        bilinear: false
  - api: TTSIM
    name: BEVDepth
    basedir: workloads/bevdepth
    module: BaseBEVDepth@BEVDepth.py
    params:
      is_train_depth: false
      training: false
      num_cameras: 1
      num_sweeps: 2
      head_conf_yaml: config/bevdepth_cfgs/bevdepth_head.yaml
      backbone_conf_yaml: config/bevdepth_cfgs/bevdepth_backbone.yaml
    instances:
      bevdepth_s:
        img_height: 32
        img_width: 32
        img_channels: 3
        bs: 1
  - api: TTSIM
    name: SwinTransformer
    basedir: workloads/Swin-Transformer
    module: SwinTransformer@SwinTransformer.py
    instances:
      swin_base:
        img_size: 224
        in_chans: 3
        bs: 1
        num_classes: 1000
  - api: TTSIM
    name: BERT
    basedir: workloads
    module: BasicLLM.py
    params:
      attn_type: bidir
      bs: 1
      drop_prob: 0.1
      norm_type: layer
      positional_encoding: learned
      use_segment_embedding: true
      vocab_sz: 30522
    instances:
      bert_base:
        nL: 12
        nH: 12
        dE: 768
        nW: 512
  - api: TTSIM
    name: YOLOv8
    basedir: workloads
    module: YOLO8@Yolo_v8.py
    instances:
      yolov8n:
        bs: 1
        in_channels: 3
        in_resolution: 640
        yaml_cfg_path: config/external_configs/yolov8n.yaml
      yolov8s:
        bs: 1
        in_channels: 3
        in_resolution: 640
        yaml_cfg_path: config/external_configs/yolov8s.yaml
      yolov8m:
        bs: 1
        in_channels: 3
        in_resolution: 640
        yaml_cfg_path: config/external_configs/yolov8m.yaml

  - api: TTSIM
    name: YOLOv7
    basedir: workloads
    module: YOLO7@YOLO_v7.py
    instances:
      yolov7-tiny:
        bs: 1
        in_channels: 3
        in_resolution: 640
        yaml_cfg_path: config/external_configs/yolov7-tiny.yaml
      yolov7-tiny-silu:
        bs: 1
        in_channels: 3
        in_resolution: 640
        yaml_cfg_path: config/external_configs/yolov7-tiny-silu.yaml
  - api: TTSIM
    name: basic_llm
    basedir: workloads
    module: BasicLLM.py
    params:
      attn_type: causal
      bs: 1
      drop_prob: 0.1
      norm_type: layer
      positional_encoding: learned
      use_segment_embedding: false
      vocab_sz: 50257
    instances:
      gpt_mini:
        nL: 6
        nH: 6
        dE: 192
        nW: 32
        seq_len: 8

  - api: TTSIM
    name: llama2
    basedir: workloads/llama2
    module: Transformer@model.py
    instances:
      llama2_small:
        dim: 32
        n_layers: 2
        n_heads: 2
        vocab_size: 256
        max_batch_size: 2
        max_seq_len: 8
        seq_len: 1
        bs: 1
      llama2_standard:
        dim: 4096
        n_layers: 32
        n_heads: 32
        vocab_size: 32000
        max_batch_size: 2
        max_seq_len: 8
        seq_len: 1
        bs: 1
